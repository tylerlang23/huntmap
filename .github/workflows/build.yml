name: Build and publish Hunt Map
on:
  workflow_dispatch:
    inputs:
      rebuild_parcels:
        description: "Rebuild the parcel tiles even if this month's copy exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["index.html", "parcels.json", "scripts/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "17 9 3 * *"   # monthly refresh of parcel data
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Month stamp
        id: stamp
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Reuse this month's parcel tiles if already built
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: site/parcels.pmtiles
          key: parcels-${{ steps.stamp.outputs.month }}-${{ hashFiles('scripts/**') }}-${{ github.event.inputs.rebuild_parcels == 'true' && github.run_id || 'keep' }}
      - name: Install map tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin unzip build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" tippecanoe
          sudo cp /tmp/tippecanoe/tippecanoe /usr/local/bin/
      - name: Build parcel tiles
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build_parcels.sh
      - name: Keep the parcel tiles for later runs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: site/parcels.pmtiles
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          [ -f parcels.json ] && cp parcels.json site/ || true
          touch site/.nojekyll
          ls -lh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
