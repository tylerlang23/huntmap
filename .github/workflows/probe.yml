name: Probe tile servers
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://tylerlang23.github.io"
          echo "---- DNR spring tileinfo"; curl -sS "https://arcgis.dnr.state.mn.us/public/rest/services/gen/spring_imagery_statewide/MapServer?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);t=d['tileInfo'];print('origin',t['origin'],'rows',t['rows'],'wkid',t['spatialReference']);print([(l['level'],round(l['resolution'],4)) for l in t['lods']])"
          echo "---- USGS services"; curl -sS "https://basemap.nationalmap.gov/arcgis/rest/services?f=json" | python3 -c "import sys,json;print([s['name'] for s in json.load(sys.stdin)['services']])"
          echo "---- USGSImageryOnly"; curl -sS "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);t=d.get('tileInfo',{});print('lods',[l['level'] for l in t.get('lods',[])],'copy',d.get('copyrightText'))"
          for u in "https://arcgis.dnr.state.mn.us/public/rest/services/gen/spring_imagery_statewide/MapServer/tile/11/23436/15500" \
                   "https://arcgis.dnr.state.mn.us/public/rest/services/gen/spring_imagery_statewide/MapServer/tile/12/46872/31000" \
                   "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/16/23436/15500" \
                   "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/17/46872/31000"; do
            echo "---- $u" | cut -c1-120
            curl -sS -o /tmp/b -D - -H "$O" "$u" | grep -iE "^HTTP|access-control-allow-origin|content-type|cache-control" | tr -d '\r'
            echo "bytes $(wc -c </tmp/b)"
          done
