name: Probe tile servers
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          pip install -q pillow >/dev/null 2>&1
          L="rr2009,neclr2009,dulclr09,ncclr09,south11,murray11,rice11,fall11,fall12,meek13,nc13ft,nc13hm,mc14,polk,nw14,carl15_9,doug16,met10,smet10,dak10,scott10,nga2012,wash13,scott13,dak13,carv13,met16,mcle18,itas18,hen18,steele19,lake19,carl19,dak19,lyon20,kooc20,belt20,met20,rams20,rice21,lesueur21,carlton21,dak21,hen21,steele22,mcle22,doug22,hen22,rice23,belt23,dak23,lyon24,lake24,met25,wab25,dak26"
          for spot in "McLeod -94.45 44.80" "Milaca -93.65 45.75" "DetroitLakes -95.85 46.82" "Worthington -95.6 43.62" "Bemidji -94.88 47.47"; do
            set -- $spot; read X Y < <(python3 -c "import math;lon,lat=$2,$3;print(lon*20037508.34/180, math.log(math.tan((90+lat)*math.pi/360))*6378137)")
            B="$(python3 -c "print(','.join(str(round(v)) for v in ($X-300,$Y-300,$X+300,$Y+300)))")"
            for F in "image/png&TRANSPARENT=TRUE" "image/jpeg"; do
              s=$(date +%s.%N); curl -sS -o /tmp/t.img "https://imageserver.gisdata.mn.gov/cgi-bin/wmsll?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=$L&STYLES=&FORMAT=$F&SRS=EPSG:3857&BBOX=$B&WIDTH=256&HEIGHT=256" -w "%{http_code} %{content_type}"; e=$(date +%s.%N)
              echo " $1 ${F:6:4} $(python3 -c "print(round($e-$s,2))")s $(wc -c </tmp/t.img)B $(python3 -c "
          from PIL import Image
          try:
            im=Image.open('/tmp/t.img').convert('RGBA'); px=list(im.getdata()); op=[p for p in px if p[3]>0]; nonw=[p for p in op if not (p[0]>245 and p[1]>245 and p[2]>245) and not (p[0]<8 and p[1]<8 and p[2]<8)]
            print('opaque',len(op)*100//len(px),'% real',len(nonw)*100//len(px),'%')
          except Exception as ex: print('notimg',open('/tmp/t.img','rb').read(200))
          ")"
            done
          done
