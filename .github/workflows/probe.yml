name: Probe tile servers
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          O="Origin: https://tylerlang23.github.io"
          echo "---- DNR roots"; for u in https://arcgis.dnr.state.mn.us/public/rest/services?f=json https://arcgis.dnr.state.mn.us/public/rest/services/gen?f=json https://arcgis.dnr.state.mn.us/arcgis/rest/services/gen?f=json; do echo "$u"; curl -sS "$u" | head -c 1500; echo; done
          echo "---- wmsll layers"; curl -sS "https://imageserver.gisdata.mn.gov/cgi-bin/wmsll?VERSION=1.1.1&SERVICE=WMS&REQUEST=GetCapabilities" -o cap.xml; python3 - <<'PY'
          import re
          x=open('cap.xml').read()
          for m in re.finditer(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>\s*<Title>([^<]+)</Title>', x): print(m.group(1),'|',m.group(2))
          PY
          echo "---- mncomp tile CORS"; curl -sS -o /tmp/b -D - -H "$O" "https://imageserver.gisdata.mn.gov/cgi-bin/wmsll?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=mncomp&STYLES=&FORMAT=image/jpeg&SRS=EPSG:3857&BBOX=-10514000,5590000,-10513400,5590600&WIDTH=256&HEIGHT=256" | grep -iE "^HTTP|access-control|content-type" ; echo "bytes $(wc -c </tmp/b)"
