name: Probe parcel coverage
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://enterprise.gisdata.mn.gov/aghost/rest/services/us_mn_state_mngeo/plan_parcels_open/FeatureServer"
          echo "---- McLeod count"; curl -sS "$B/1/query?where=co_name%3D%27McLeod%27&returnCountOnly=true&f=json"; echo
          echo "---- counties in dataset"; curl -sS "$B/0/query?where=1%3D1&outFields=countyname&returnGeometry=false&f=json" | grep -oE '"countyname":"[^"]+"' | sort | tr '\n' ' '; echo
          echo "---- McLeod sample"; curl -sS "$B/1/query?where=co_name%3D%27McLeod%27&outFields=owner_name,acres_deed,ctu_name&returnGeometry=false&resultRecordCount=3&f=json"; echo
